[build]
  command = "npm run build"
  # Nitro's netlify preset emits static assets here and the SSR handler into
  # .netlify/functions-internal/server. Not dist/client — that is the
  # Cloudflare Worker build's asset dir and has no index.html.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify serves matching static files first, so this only catches routes that
# aren't on disk and hands them to the SSR function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
