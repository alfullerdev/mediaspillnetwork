<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form registration</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Netlify detects forms by parsing static HTML at deploy time. The real
      contact form is rendered by the SSR function, so it is never present in
      the published files and would go undetected. This file exists purely so
      the "contact" form is registered; the field names must stay in sync with
      the form in app/page.tsx.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="subject" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
